<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title class="text-center text-success">Amelia-Codes</title>
    <link href="https://fonts.googleapis.com/css?family=Special+Elite" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       <style>
    .bg {
      background-image: url('fiiish.png');
      height: 100vh;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }
         
body {
  font-family: 'Courier Prime';
}
h1 {
  font-weight: 900;
}
.content-box {
  background-color: rgba(52, 58, 64, 0.7);
  padding: 30px;
  border: 1px solid #000000;
}
.btn {
  border-radius: 0;
  box-shadow: 0 6px 10px -2px rgba(0, 0, 0, 0.6);
}
  </style>
  </head>
<body class="bg d-flex flex-column justify-content-center align-items-center fw-bold vh-100">
<div class="content-box text-center p-4">
  <h1 id="title" class="row justify-content-center align-items-center"></h1>
  <div class="btn-group" role="group" aria-label="Vertical button group">
    <button type="button" class="btn btn-outline-light">About Me</button>
    <button type="button" class="btn btn-outline-light">Projects</button>
    <button type="button" class="btn btn-outline-light">Puzzles</button>
    <button type="button" class="btn btn-outline-light">Notes</button>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
  var i = 0;
var txt = 'Amelia-Codes Portfolio'; /* The text */
var speed = 50; /* The speed/duration of the effect in milliseconds */

function typeWriter() {
  if (i < txt.length) {
    document.getElementById("title").innerHTML += txt.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  }
}  
typeWriter()
</script>
</body>
</html>
